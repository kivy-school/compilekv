name: Attach wheel to release

# Runs *after* a release is published by hand: it never creates or tags a
# release, it only builds the wheel for one that already exists and uploads it
# as an asset.
#
# The wheel ships a prebuilt compilekv.wasm, so it is py3-none-any: one build
# serves every platform. Building it needs a Swift toolchain and a matching
# wasm SDK, which this workflow installs from scratch on the runner.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build and attach the wheel to"
        required: true
        type: string

permissions:
  contents: write

env:
  SWIFT_VERSION: "6.3.3"
  WASM_SDK_URL: "https://download.swift.org/swift-6.3.3-release/wasm-sdk/swift-6.3.3-RELEASE/swift-6.3.3-RELEASE_wasm.artifactbundle.tar.gz"
  WASM_SDK_CHECKSUM: "cabfa08b73bb8ac783927ecd15fa386e99d0c139c5f232445067bcf58379cae7"
  # Pin the SDK build_wasm.py picks, so the embedded variant can never win.
  COMPILEKV_WASM_SDK: "swift-6.3.3-RELEASE_wasm"

jobs:
  wheel:
    runs-on: ubuntu-24.04
    steps:
      - name: Resolve the release tag
        id: release
        run: echo "tag=${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}

      - name: Install swiftly and Swift ${{ env.SWIFT_VERSION }}
        run: |
          set -euo pipefail
          curl -fsSL -O "https://download.swift.org/swiftly/linux/swiftly-$(uname -m).tar.gz"
          tar zxf "swiftly-$(uname -m).tar.gz"
          ./swiftly init --quiet-shell-followup --assume-yes --skip-install
          . "${SWIFTLY_HOME_DIR:-$HOME/.local/share/swiftly}/env.sh"
          swiftly install "$SWIFT_VERSION" --use --assume-yes --post-install-file=/tmp/swift-post-install.sh
          # swiftly writes this only when the toolchain needs system packages.
          if [ -f /tmp/swift-post-install.sh ]; then sudo bash /tmp/swift-post-install.sh; fi
          # Every later step gets the toolchain on PATH.
          echo "${SWIFTLY_BIN_DIR:-$HOME/.local/share/swiftly/bin}" >> "$GITHUB_PATH"
          swift --version

      - name: Install the WebAssembly Swift SDK
        run: |
          set -euo pipefail
          swift sdk install "$WASM_SDK_URL" --checksum "$WASM_SDK_CHECKSUM"
          swift sdk list

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Build the wheel
        run: uv build --wheel

      - name: Smoke-test the built wheel
        run: |
          set -euo pipefail
          uv venv /tmp/verify
          # Install from the wheel only, so the test run exercises the artifact
          # rather than ./src.
          uv pip install --python /tmp/verify/bin/python dist/*.whl pytest
          /tmp/verify/bin/pytest

      - uses: actions/upload-artifact@v4
        with:
          name: compilekv-wheel
          path: dist/*.whl

      - name: Attach the wheel to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ steps.release.outputs.tag }}" dist/*.whl --clobber
