name: PyPI Release

# Publishes to PyPI when a version tag is pushed.
#
# Same shape as the reference workflow (build job -> publish job with trusted
# publishing), but the wheel here is not pure Python source: setup.py compiles
# the Swift package to compilekv.wasm during the build, so the build job first
# installs a Swift toolchain and the matching wasm SDK, exactly as the
# "Attach wheel to release" workflow does.

on:
  push:
    tags:
      - "[0-9]*"
  workflow_dispatch:

env:
  SWIFT_VERSION: "6.3.3"
  WASM_SDK_URL: "https://download.swift.org/swift-6.3.3-release/wasm-sdk/swift-6.3.3-RELEASE/swift-6.3.3-RELEASE_wasm.artifactbundle.tar.gz"
  WASM_SDK_CHECKSUM: "cabfa08b73bb8ac783927ecd15fa386e99d0c139c5f232445067bcf58379cae7"
  # Pin the SDK build_wasm.py picks, so the embedded variant can never win.
  COMPILEKV_WASM_SDK: "swift-6.3.3-RELEASE_wasm"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install swiftly and Swift ${{ env.SWIFT_VERSION }}
        run: |
          set -euo pipefail
          curl -fsSL -O "https://download.swift.org/swiftly/linux/swiftly-$(uname -m).tar.gz"
          tar zxf "swiftly-$(uname -m).tar.gz"
          ./swiftly init --quiet-shell-followup --assume-yes --skip-install
          . "${SWIFTLY_HOME_DIR:-$HOME/.local/share/swiftly}/env.sh"
          swiftly install "$SWIFT_VERSION" --use --assume-yes --post-install-file=/tmp/swift-post-install.sh
          # swiftly writes this only when the toolchain needs system packages.
          if [ -f /tmp/swift-post-install.sh ]; then sudo bash /tmp/swift-post-install.sh; fi
          # Every later step gets the toolchain on PATH.
          echo "${SWIFTLY_BIN_DIR:-$HOME/.local/share/swiftly/bin}" >> "$GITHUB_PATH"
          swift --version

      - name: Install the WebAssembly Swift SDK
        run: |
          set -euo pipefail
          swift sdk install "$WASM_SDK_URL" --checksum "$WASM_SDK_CHECKSUM"
          swift sdk list

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"

      - name: Build distributions
        run: uv build

      - name: Smoke-test the built wheel
        run: |
          set -euo pipefail
          uv venv /tmp/verify
          # Install from the wheel only, so the test run exercises the artifact
          # rather than ./src.
          uv pip install --python /tmp/verify/bin/python dist/*.whl pytest
          /tmp/verify/bin/pytest

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
